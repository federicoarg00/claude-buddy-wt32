; Claude Buddy — WT32-SC01 firmware
;
; Two build targets:
;   wt32-sc01       → original board (ESP32-WROVER-B, ST7796 over SPI)
;   wt32-sc01-plus  → Plus board (ESP32-S3, ST7796 over 8-bit parallel)
;
; Build:  pio run -e wt32-sc01
; Flash:  pio run -e wt32-sc01 -t upload

[platformio]
default_envs = wt32-sc01

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.1.0

[env:wt32-sc01]
platform = espressif32@6.9.0
board = esp32dev
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_SC01
    -DBOARD_HAS_PSRAM

[env:wt32-sc01-plus]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_SC01_PLUS
    -DBOARD_HAS_PSRAM
